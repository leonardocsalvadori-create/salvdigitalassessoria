
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          NITRO_PRESET: github-pages

      - name: Locate generated files
        run: |
          echo "=== Diretório raiz ==="
          ls -lah
          echo "=== Arquivos index.html ==="
          find . -name index.html -not -path './node_modules/*'
          echo "=== Pastas de saída ==="
          find . -maxdepth 3 -type d \( -name public -o -name client -o -name dist \)

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        run: echo "Aguardando identificação da pasta correta de publicação."
