
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          NITRO_PRESET: github-pages

      - name: Inspect dist output
        run: |
          echo "=== dist ==="
          find dist -maxdepth 4 -type f -printf '%p (%s bytes)\n' | sort
          echo "=== dist/client ==="
          ls -lah dist/client
